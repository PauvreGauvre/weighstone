name: Materialize Weighstone sources
on:
  push:
    paths:
      - 'bootstrap/ready.txt'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand verified bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/parts/part_* | base64 --decode | xz --decompress | tar -xf -
          test -f Weighstone/MANIFEST.yaml
          test -f Weighstone/include/Weighstone/CCINT.hpp
          test "$(find Weighstone/manual/chapters -maxdepth 1 -name '*.md' | wc -l)" -eq 40
          cp -a Weighstone/. .
          rm -rf Weighstone bootstrap
          rm -f .github/workflows/materialize.yml
          git add -A
          git -c user.name='weighstone-bootstrap[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Materialize CCINT headers, 40-chapter manual and manifest'
          git push
